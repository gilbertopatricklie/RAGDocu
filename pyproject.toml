[project]
name = "ragdocu"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gilberto Patrick Lie", email = "gilbertopatricklie@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.162.5",
    "langchain>=1.4.10",
    "langchain-chroma>=1.1.0",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "numpy>=2.4.6",
    "pymupdf>=2.1",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
ragdocu = "ragdocu.main:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
